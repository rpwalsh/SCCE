name: Acquire full Wikipedia sources
on:
  push:
    branches: [codex/scce-corpus-20261108]
    paths: [.github/workflows/scce-wikipedia-sources.yml]
permissions:
  contents: write
concurrency:
  group: scce-full-wikipedia-source-mirror
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      editions: ${{ steps.prepare.outputs.editions }}
    steps:
      - name: Fetch pinned acquisition tools
        run: |
          gh api "repos/$GH_REPO/contents/tools/corpus-acquisition/mirror-wikipedia-release.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > mirror.py
          gh api "repos/$GH_REPO/contents/tools/corpus-acquisition/dump-plan.json?ref=$GITHUB_SHA" --jq .content | base64 --decode > dump-plan.json
      - name: Prepare unpublished source storage
        id: prepare
        run: |
          python3 mirror.py validate
          python3 mirror.py prepare
  mirror:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        edition: ${{ fromJSON(needs.prepare.outputs.editions) }}
    steps:
      - name: Fetch pinned acquisition tools
        run: |
          gh api "repos/$GH_REPO/contents/tools/corpus-acquisition/mirror-wikipedia-release.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > mirror.py
          gh api "repos/$GH_REPO/contents/tools/corpus-acquisition/dump-plan.json?ref=$GITHUB_SHA" --jq .content | base64 --decode > dump-plan.json
      - name: Copy and verify edition parts
        env:
          EDITION: ${{ matrix.edition }}
        run: python3 mirror.py mirror --edition "$EDITION"
  finalize:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, mirror]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch pinned acquisition tools
        run: |
          gh api "repos/$GH_REPO/contents/tools/corpus-acquisition/mirror-wikipedia-release.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > mirror.py
          gh api "repos/$GH_REPO/contents/tools/corpus-acquisition/dump-plan.json?ref=$GITHUB_SHA" --jq .content | base64 --decode > dump-plan.json
      - name: Record exact completion status
        run: python3 mirror.py finalize
