# Optional extra read-only mounts for corpora stored outside SCCE_CORPUS_ROOT.
# Paths are deployment settings, not new corpus identities or authorization to ingest.
# docker compose -f compose.yaml -f deploy/compose.corpora.example.yaml run --rm worker ...
x-corpus-mounts: &corpus-mounts
  - type: bind
    source: ${SCCE_WIKIPEDIA_DIR:?Set the directory containing the verified full dump and index}
    target: /data/corpora/wikipedia
    read_only: true
    bind: {create_host_path: false}
services:
  worker:
    volumes: *corpus-mounts
  evaluation:
    volumes: *corpus-mounts
  server:
    volumes: *corpus-mounts
  server-media:
    volumes: *corpus-mounts
# Add equivalent mounts for gutenberg, oss, multilingual, dialogue, documents,
# spreadsheets, images, audio, video, or any custom source under /data/corpora.
