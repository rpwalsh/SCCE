}
mutation VscodeLearningPursueMutation($input: VscodePlanCommandInput!) {
  vscodeLearningPursue(input: $input) { schema answer held { id uri title preview evidenceCount } clientMutationId }
}
mutation VscodeReviewHeldSourceMutation($input: VscodeReviewCommandInput!) {
  vscodeReviewHeldSource(input: $input) { schema review { id decision promotedEvidence } clientMutationId }
}
mutation VscodeApprovePlanMutation($input: VscodePlanCommandInput!) {
